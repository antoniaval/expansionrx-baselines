name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/01_fingerprint_baseline.ipynb', as_version=4))"
